<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Análise dos Desafios e Problemas — Missão Belém</title>
<style>
:root{--blue:#173f73;--gold:#d99a24;--bg:#f4f7fb;--card:#fff;--text:#182333;--muted:#657287;--line:#dce3ec}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;line-height:1.45}
header{background:linear-gradient(135deg,#173f73,#2f6fab);color:white;padding:28px 18px} header div{max-width:920px;margin:auto} h1{font-size:clamp(24px,5vw,38px);margin:0 0 8px} header p{margin:0;opacity:.92}
main{max-width:920px;margin:22px auto;padding:0 14px 60px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #173f7312}
h2{color:var(--blue);margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}label{font-weight:700;display:block;margin:8px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #bcc8d8;border-radius:10px;background:#fff;font:inherit}textarea{min-height:92px;resize:vertical}.topic{border-left:6px solid var(--gold)}.topic h2 span{display:inline-flex;background:#fff1d3;color:#805400;border-radius:999px;padding:3px 9px;font-size:13px;margin-right:7px}.hint{color:var(--muted);font-size:14px}.priority{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.priority label{font-weight:400;border:1px solid var(--line);border-radius:9px;padding:9px;text-align:center;margin:0}.priority input{width:auto;margin-right:4px}.actions{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;background:#f4f7fbe8;padding:12px 0;backdrop-filter:blur(5px)}button{border:0;border-radius:10px;padding:13px 17px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#e7edf5;color:var(--blue)}.success{background:#28794d;color:white}#status{font-size:14px;color:var(--muted);align-self:center}.rank{display:grid;grid-template-columns:70px 1fr;gap:9px;align-items:center;margin:9px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}.priority{grid-template-columns:repeat(2,1fr)}.card{padding:16px}}
.print-text{display:none}
@media print{.actions{display:none}body{background:white}.card{box-shadow:none}textarea{display:none}.print-text{display:block;white-space:pre-wrap;word-wrap:break-word;border:1px solid #bcc8d8;border-radius:10px;padding:10px;min-height:40px}label{break-after:avoid}}
</style>
</head><body>
<header><div><h1>ANÁLISE POR “PRESÉPIO” RELATIVA ÀS CASAS DE ACOLHIDA</h1><p><strong>CONFRONTE OS DADOS DO RELATÓRIO E RESPONDA NO GERAL</strong></p></div></header>
<main><form id="f">
<section class="card"><h2>Identificação</h2><div class="grid">
<div class="full"><label>Nome dos Coordenadores de Presépio</label><input name="responsavel" required></div>
<div><label>Presépio</label><input name="presepio" required></div><div><label>Vilas</label><input name="vilas" required></div>
</div></section>
<section class="card"><h2>Resposta relativa ao nosso Presépio</h2><p class="hint"><strong>PROBLEMAS:</strong> analise cada um dos aspectos abaixo considerando a realidade do nosso Presépio.</p></section>
<div id="topics"></div>
<section class="card topic"><h2>Resposta relativa à Missão Belém no todo</h2><label>Temos algo para aconselhar a outros Presépios ou à Missão Belém no todo?</label><textarea name="conselho_missao_belem" style="min-height:150px"></textarea></section>
<div class="actions"><button type="submit" class="success">Salvar resposta</button><button type="button" class="secondary" onclick="downloadTXT()">Baixar resposta (.txt)</button><button type="button" class="secondary" onclick="window.print()">Imprimir / PDF</button><span id="status"></span></div>
</form></main>
<script>
const temas=[
'Crescimento (meta)','Pastoral de Rua','Triagens','Relacionamento / comunhão nas casas, Vilas e Sítios','Estrutura de governo: coordenações','Suscitar vocação de Cireneu, Irmão Inserido etc.','Acolhidos em geral','Formação catequética dos acolhidos, inclusive diálogos catequéticos','Formação, retiros e espiritualidade dos Cireneus, Pais e Servos, Pastores etc.','Formação F1 / F2 / F3 / F4','Acompanhamento das pessoas “de frente”','Acompanhamento dos Irmãos Inseridos e voluntários','Outro problema','Outro problema','Outro problema'
];
const topics=document.getElementById('topics');
const outro=t=>t==='Outro problema';
temas.forEach((t,i)=>{const n=i+1;topics.insertAdjacentHTML('beforeend',`<section class="card topic"><h2><span>${n}</span><b id="h${n}">${t}</b></h2>
${outro(t)?`<label>Qual é o outro problema? (nome/título)</label><input name="t${n}_titulo" data-h="${n}" placeholder="Ex.: Finanças, Comunicação, Transporte...">`:''}
<label>1. ${n===1 ? 'Qual problema concreto identificamos nesse aspecto da falta de crescimento?' : 'Qual é o problema concreto?'}</label><textarea name="t${n}_problema"></textarea>
<label>2. Quais são as principais causas?</label><textarea name="t${n}_causas"></textarea>
<label>3. O que já estamos fazendo?</label><textarea name="t${n}_fazendo"></textarea>
<label>4. O que precisamos mudar ou fazer para solucionar o problema?</label><textarea name="t${n}_mudar"></textarea>
<label>5. Quem deveria assumir essa ação?</label><textarea name="t${n}_responsavel"></textarea>
<label>6. Qual deveria ser a prioridade?</label><div class="priority">${['Baixa','Média','Alta','Urgente'].map(p=>`<label><input type="radio" name="t${n}_prioridade" value="${p}">${p}</label>`).join('')}</div></section>`)});
const form=document.getElementById('f'), status=document.getElementById('status');
function data(){return Object.fromEntries(new FormData(form).entries())}
function autosave(){try{localStorage.setItem('mb_desafios_rascunho',JSON.stringify(data()));status.textContent='Rascunho salvo neste aparelho.'}catch(e){status.textContent='⚠ Este navegador não permite salvar (aba anônima?). Use "Baixar resposta".'}}
// Cópia do texto de cada caixa para a impressão (a caixa só imprime as linhas visíveis)
form.querySelectorAll('textarea').forEach(ta=>ta.insertAdjacentHTML('afterend','<div class="print-text"></div>'));
function syncPrint(){form.querySelectorAll('textarea').forEach(ta=>ta.nextElementSibling.textContent=ta.value)}
// Título do "Outro problema" digitado pelo usuário
function syncTitulos(){form.querySelectorAll('[data-h]').forEach(inp=>{document.getElementById('h'+inp.dataset.h).textContent=inp.value.trim()||'Outro problema'})}
window.addEventListener('beforeprint',syncPrint);
form.addEventListener('input',()=>{syncPrint();syncTitulos();clearTimeout(window.st);window.st=setTimeout(autosave,500)});
form.addEventListener('submit',e=>{e.preventDefault();try{localStorage.setItem('mb_teste','1')}catch(err){alert('Este navegador não permite salvar (aba anônima?). Use "Baixar resposta" para guardar o arquivo.');return}const all=JSON.parse(localStorage.getItem('mb_desafios_respostas')||'[]');all.push({...data(),data_envio:new Date().toISOString()});localStorage.setItem('mb_desafios_respostas',JSON.stringify(all));status.textContent='Resposta salva neste aparelho.';alert('Resposta salva com sucesso neste aparelho.');});
const perguntas=[['problema','1. Qual é o problema concreto?'],['causas','2. Quais são as principais causas?'],['fazendo','3. O que já estamos fazendo?'],['mudar','4. O que precisamos mudar ou fazer para solucionar o problema?'],['responsavel','5. Quem deveria assumir essa ação?'],['prioridade','6. Qual deveria ser a prioridade?']];
function slug(s){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()}
function downloadTXT(){
  const d=data(),v=k=>(d[k]||'').trim(),L=[],linha='='.repeat(60);
  L.push('ANÁLISE POR "PRESÉPIO" RELATIVA ÀS CASAS DE ACOLHIDA',linha,
    'Coordenadores: '+v('responsavel'),'Presépio: '+v('presepio'),'Vilas: '+v('vilas'),
    'Data: '+new Date().toLocaleDateString('pt-BR'),'',linha,'RESPOSTA RELATIVA AO NOSSO PRESÉPIO',linha);
  const vazios=[];
  temas.forEach((t,i)=>{const n=i+1,titulo=outro(t)?(v(`t${n}_titulo`)||t):t;
    if(!perguntas.some(([k])=>v(`t${n}_${k}`))){if(!outro(t))vazios.push(n+'. '+titulo);return}
    L.push('',`${n}. ${titulo.toUpperCase()}`,'-'.repeat(60));
    perguntas.forEach(([k,q])=>{const r=v(`t${n}_${k}`);L.push(n===1&&k==='problema'?'1. Qual problema concreto identificamos nesse aspecto da falta de crescimento?':q,r||'(sem resposta)','')})});
  if(vazios.length)L.push('','Temas não respondidos: '+vazios.join('; '));
  L.push('',linha,'RESPOSTA RELATIVA À MISSÃO BELÉM NO TODO',linha,'Temos algo para aconselhar a outros Presépios ou à Missão Belém no todo?',v('conselho_missao_belem')||'(sem resposta)');
  const nome=['analise',slug(v('presepio'))||'presepio',new Date().toISOString().slice(0,10)].join('-')+'.txt';
  const blob=new Blob(['﻿'+L.join('\n').replace(/\r?\n/g,'\r\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.addEventListener('load',()=>{try{const d=JSON.parse(localStorage.getItem('mb_desafios_rascunho')||'{}');Object.entries(d).forEach(([k,v])=>{const els=form.elements[k];if(!els)return;if(els instanceof RadioNodeList){[...els].forEach(e=>{if(e.value===v)e.checked=true})}else els.value=v})}catch(e){}syncPrint();syncTitulos()});
</script></body></html>
